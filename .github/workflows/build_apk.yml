name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate clean official Android host
        working-directory: ./android_app
        run: |
          # 1. 清理旧手写配置，生成 100% 官方标准的 Gradle Wrapper 与 Android 宿主
          rm -rf android
          flutter create --platforms=android --org com.sd0739 .

          # 2. 注入 AndroidManifest 权限与网络配置
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          content = p.read_text(encoding="utf-8")
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          """
          content = content.replace("<application", perms + "\n    <application", 1)
          content = content.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          p.write_text(content, encoding="utf-8")
          print("AndroidManifest updated!")

          bp = Path("android/app/build.gradle")
          if bp.exists():
              bs = bp.read_text(encoding="utf-8")
              bs = bs.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              bs = bs.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              bp.write_text(bs, encoding="utf-8")
              print("build.gradle minSdk updated to 21!")
          PY

      - name: Install dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./android_app
        run: |
          flutter build apk --release --verbose > build.log 2>&1 || {
            echo "====== BUILD FAILED - LOG TAIL ======"
            tail -n 250 build.log
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android_app/build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chaoji-huiwan-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
