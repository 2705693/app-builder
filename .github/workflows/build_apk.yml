name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate clean official Android host
        working-directory: ./android_app
        run: |
          # 1. 清理旧配置，重新生成纯正的官方 Android 宿主工程
          rm -rf android
          flutter create --platforms=android --org com.sd0739 .

          # 2. 注入权限并锁定 minSdk 为 21
          python3 - <<'PY'
          import glob
          from pathlib import Path

          # 注入 AndroidManifest 权限
          for mf in glob.glob("android/app/src/main/AndroidManifest.xml"):
              p = Path(mf)
              c = p.read_text(encoding="utf-8")
              perms = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              """
              if "<uses-permission" not in c:
                  c = c.replace("<application", perms + "\n    <application", 1)
              if 'android:usesCleartextTraffic="true"' not in c:
                  c = c.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
              p.write_text(c, encoding="utf-8")
              print("Updated permissions in:", mf)

          # 强制将 minSdk 提高到 21（满足 video_player 与相册插件的最低要求）
          for bg in glob.glob("android/app/build.gradle*"):
              p = Path(bg)
              s = p.read_text(encoding="utf-8")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              s = s.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
              s = s.replace("minSdk flutter.minSdkVersion", "minSdk 21")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              p.write_text(s, encoding="utf-8")
              print("Updated minSdk to 21 in:", bg)
          PY

      - name: Install dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./android_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoji-huiwan-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
