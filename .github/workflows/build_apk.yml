name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate clean official Android host
        working-directory: ./android_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sd0739 .
          python3 fix_android.py

      - name: Install dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./android_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoji-huiwan-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
