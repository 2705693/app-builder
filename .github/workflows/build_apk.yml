name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate and configure standard Android host
        working-directory: ./android_app
        run: |
          # 1. 自动补齐完整的官方 gradle wrapper 与 android 宿主工程
          flutter create --platforms=android --org com.sd0739 .

          # 2. 注入 AndroidManifest 权限与网络配置
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          content = p.read_text(encoding="utf-8")
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          """
          if "<uses-permission" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          if 'android:usesCleartextTraffic="true"' not in content:
              content = content.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          p.write_text(content, encoding="utf-8")
          print("AndroidManifest permissions injected successfully!")
          PY

          # 3. 确保 minSdk 设置为 21（支持视频播放与相册保存插件）
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          p.write_text(s, encoding="utf-8")
          print("minSdk updated successfully!")
          PY

      - name: Install dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./android_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoji-huiwan-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
