name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # package_info_plus 9.x 需要新版 Flutter Gradle 插件环境。
          # 固定版本保证 CI 可重复，避免 stable 漂移造成构建结果变化。
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Recreate clean official Android host
        working-directory: ./android_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sd0739 .
          python3 fix_android.py

      - name: Install dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./android_app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android_app/build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yilian-quying-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android_app/build/app/outputs/flutter-apk/app-release.apk "yilian-quying-v1.0.3.apk"
          git tag -f android-latest "$GITHUB_SHA"
          git push origin refs/tags/android-latest --force
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "一链取影 Android 最新版" --notes "由 GitHub Actions 自动构建。"
          gh release view android-latest --json assets --jq '.assets[].name' | \
            while read -r asset; do
              case "$asset" in *.apk) gh release delete-asset android-latest "$asset" --yes ;; esac
            done
          gh release edit android-latest --title "一链取影 Android 最新版"
          gh release upload android-latest "yilian-quying-v1.0.3.apk" --clobber
